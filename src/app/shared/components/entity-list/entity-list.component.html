<div class="mx-auto my-6 max-w-6xl px-4">
  <div class="border border-gray-200 rounded-lg overflow-hidden bg-base-100 shadow-sm">
    <div class="p-4">
      <header class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold">{{ title }}</h2>

    <div class="flex gap-2 items-center">
      <input
        [(ngModel)]="query"
        placeholder="Buscar..."
        class="input input-sm"
        aria-label="Buscar"
      />
      <button (click)="onAdd()" class="btn btn-sm btn-primary">Agregar</button>
    </div>
  </header>

  <div class="overflow-auto">
    <table class="table w-full">
      <thead>
        <tr>
          <th *ngFor="let c of columns">{{ c }}</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredItems">
          <td *ngFor="let c of columns">{{ item[c] }}</td>
          <td>
            <!-- If you prefer route links, set routerPrefix and the rows will link to /prefix/view/:id and /prefix/edit/:id -->
            <a *ngIf="routerPrefix" [routerLink]="[routerPrefix, 'view', item[idKey]]" class="btn btn-xs btn-ghost mr-1">Ver</a>
            <a *ngIf="routerPrefix" [routerLink]="[routerPrefix, 'edit', item[idKey]]" class="btn btn-xs btn-ghost mr-1">Editar</a>
            <button (click)="onDelete(item)" class="btn btn-xs btn-error">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="(filteredItems || []).length === 0">
          <td [attr.colspan]="columns.length + 1" class="text-center py-6 opacity-60">No hay resultados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
  </div>
</div>
